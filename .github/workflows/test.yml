name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    # Everything here runs without a model. The parts that call one are
    # exercised by actually training, not by CI.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover tests -v
